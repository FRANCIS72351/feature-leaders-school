{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-4">Access denied</h1>
  <p class="lead">You do not have permission to open this page.</p>
  {% if current_user.is_authenticated %}
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to your dashboard</a>
  {% else %}
  <a class="btn btn-primary" href="{{ url_for('login') }}">Sign in</a>
  {% endif %}
</div>
{% endblock %}
