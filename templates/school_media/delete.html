{% extends "base.html" %}
{% block title %}Delete School Media{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 640px;">
    <h1 class="h4 fw-bold mb-2">Remove this media item?</h1>
    <p class="text-muted">This will take <strong>{{ item.title }}</strong> off the school portal.</p>
    <form method="post" class="bg-white border rounded-3 p-4 shadow-sm">
        {{ form.hidden_tag() }}
        <div class="d-flex gap-2">
            {{ form.submit(class="btn btn-danger") }}
            <a href="{{ url_for('school_media_manage') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
