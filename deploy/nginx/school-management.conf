# Nginx reverse proxy for School Management System
# Install: sudo cp deploy/nginx/school-management.conf /etc/nginx/sites-available/school-management
#          sudo ln -s /etc/nginx/sites-available/school-management /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is REQUIRED for the installable app (Add to Home Screen) and the offline
# screen: browsers refuse to register a service worker over plain HTTP. After
# DNS points at this server, run  sudo certbot --nginx -d flpa2015.com
# then enable the redirect on line 24 and the 443 block at the bottom.

upstream school_management_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Rate limit login attempts
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name flpa2015.com www.flpa2015.com;

    # Redirect HTTP to HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 16M;

    access_log /var/log/nginx/school-management.access.log;
    error_log  /var/log/nginx/school-management.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Static files — served directly by Nginx (faster than Flask)
    location /static/ {
        alias /var/www/school-management/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        gzip_static on;
    }

    location /static/uploads/ {
        alias /var/www/school-management/static/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # The worker must never be cached, or devices keep an outdated app shell.
    location = /sw.js {
        proxy_pass http://school_management_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://school_management_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://school_management_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

